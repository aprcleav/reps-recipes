<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reps & Recipes</title>
    <meta name="description"
        content="Reps & Recipes is a web app that helps you plan meals and workouts. Final project for WDD 330 at BYU-Idaho.">
    <meta name="author" content="April Cleaver">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/large.css">
    <script src="scripts/main.js" type="module"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
    <header id="main-header"></header>
    <main>
        <section id="search-box">
            <div class="search">
                <img src="images/dumbbell.png" class="icon" alt="exercise icon">
                <input type="search" id="search-exc" name="search-exc" placeholder="Search exercise">
                <img src="images/search.svg" alt="search icon">
                <div class="random">
                    <p> OR </p>
                    <button id="random-exercise">Get Random</button>
                </div>
            </div>
        </section>
        <section id="exercise-cards"></section>
    </main>
    <footer id="main-footer"></footer>
</body>

</html>
